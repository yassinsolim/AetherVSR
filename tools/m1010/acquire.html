<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AetherVSR acquisition research</title>
<body><h1>AetherVSR acquisition research</h1><output id="status" role="status">Connecting</output>
<p><button id="info">Refresh selection</button><button id="origin">Grant source origin</button><button id="revoke-origin">Revoke source origin</button>
<button id="capture-permission">Grant tab capture</button><button id="tab">Start tab mirror</button><button id="rtc">Start media mirror</button>
<button id="direct">Direct replay</button><button id="refetch">Refetch replay</button><button id="stop">Stop acquisition</button></p>
<video id="input" controls playsinline muted style="display:block;max-width:100%;width:720px;background:black"></video>
<p><button id="probe">Probe pixels and tracks</button><button id="play">Play canonical source</button><button id="pause">Pause canonical source</button><button id="seek">Seek canonical source to 1s</button></p>
<pre id="result"></pre><script src="acquire.js"></script></body></html>
