<!doctype html>
<meta charset="utf-8">
<title>AetherVSR presentation transition fixture</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #fff; }
  body { min-height: 2400px; }
  #shift { height: 280px; }
  #parent, #destination { margin-left: 40px; width: 640px; position: relative; }
  #destination { margin-top: 20px; }
  #player { width: 640px; height: 360px; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; }
  #parent.moved { left: 37px; }
  #parent.sized { container-type: size; width: 640px; height: 360px; }
  #parent.sized #player { position: absolute; inset: 0; }
  #parent.nested { overflow: hidden; height: 420px; }
  #parent.nested #player { margin-top: 240px; }
  #parent.nested::after { content: ''; display: block; height: 700px; }
  #player:fullscreen { width: 100%; height: 100%; background: #000; }
  #actions { position: fixed; top: 8px; right: 8px; z-index: 10; }
</style>
<div id="shift"></div>
<div id="parent"><div id="player"><video autoplay muted playsinline loop src="/media/m9/720p60.mp4"></video></div></div>
<div id="destination"></div>
<div id="actions"><button id="fullscreen">Fullscreen</button><button id="exit">Exit fullscreen</button></div>
<script>
  document.getElementById('fullscreen').onclick = () => document.getElementById('player').requestFullscreen();
  document.getElementById('exit').onclick = () => document.exitFullscreen();
  const video = document.querySelector('video');
  const parent = document.getElementById('parent');
  let sourceBuffer, mediaSource, mediaUrl;
  const append = bytes => new Promise((done, reject) => {
    const end = () => { cleanup(); done(); };
    const fail = () => { cleanup(); reject(new Error('Fixture SourceBuffer append failed')); };
    const cleanup = () => { sourceBuffer.removeEventListener('updateend', end); sourceBuffer.removeEventListener('error', fail); };
    sourceBuffer.addEventListener('updateend', end); sourceBuffer.addEventListener('error', fail);
    sourceBuffer.appendBuffer(bytes);
  });
  window.__M107_FIXTURE__ = {
    async prepare(name) {
      if (name === 'nested-scroll') parent.classList.add('nested');
      if (name === 'size-container') parent.classList.add('sized');
      if (name === 'intrinsic-resize' || name === 'fullscreen-abr' || name === 'scroll-abr') {
        const low = await fetch('/m107-media/low.mp4').then(response => response.arrayBuffer());
        const config = await fetch('/m107-media/config.json').then(response => response.json());
        mediaSource = new MediaSource(); mediaUrl = URL.createObjectURL(mediaSource); video.src = mediaUrl;
        await new Promise(done => mediaSource.addEventListener('sourceopen', done, { once: true }));
        sourceBuffer = mediaSource.addSourceBuffer(config.mime); sourceBuffer.mode = 'sequence';
        await append(low); await video.play();
      }
      return { name, source: { width: video.videoWidth, height: video.videoHeight } };
    },
    async action(name) {
      window.dispatchEvent(new CustomEvent('aethervsr:m107:operation', { detail: `${name}:begin` }));
      if (name.startsWith('scroll-')) scrollTo({ top: Number(name.slice(7)), behavior: 'instant' });
      else if (name === 'smooth') scrollTo({ top: 228, behavior: 'smooth' });
      else if (name === 'nested') parent.scrollTop = 228;
      else if (name === 'ancestor-shift') document.getElementById('shift').style.height = '317px';
      else if (name === 'class-shift') parent.classList.toggle('moved');
      else if (name === 'style-shift') parent.style.left = '23px';
      else if (name === 'reparent') {
        const destination = document.getElementById('destination');
        destination.style.cssText = 'position:absolute;top:280px;height:360px';
        destination.append(video);
      } else if (name === 'source-high' || name === 'source-low') {
        if (!sourceBuffer) throw new Error('Prepare intrinsic-resize first');
        const at = sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1);
        video.loop = false;
        await append(await fetch(`/m107-media/${name === 'source-high' ? 'high' : 'low'}.mp4`).then(response => response.arrayBuffer()));
        video.currentTime = at + 0.1;
        await video.play();
      } else if (name === 'unsupported-effect') parent.style.filter = 'blur(1px)';
      else throw new Error(`Unknown fixture action: ${name}`);
      window.dispatchEvent(new CustomEvent('aethervsr:m107:operation', { detail: `${name}:after` }));
      return { name, at: performance.now() };
    },
  };
  window.addEventListener('pagehide', () => { if (mediaUrl) URL.revokeObjectURL(mediaUrl); });
</script>
