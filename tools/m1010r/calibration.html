<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AetherVSR no-neural calibration</title>
<link rel="stylesheet" href="player.css">
<body>
<header><strong>AetherVSR</strong><output id="status" role="status">NOT_RUN</output></header>
<main id="stage"><canvas id="output" aria-label="Baseline video"></canvas></main>
<video id="source" preload="auto" playsinline></video>
<footer id="controls">
  <button id="play" type="button">Play</button><button id="pause" type="button" disabled>Pause</button>
  <input id="seek" aria-label="Seek" type="range" min="0" max="70" step="0.01" value="0" disabled>
  <input id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="1" disabled>
  <label><input id="mute" type="checkbox" disabled>Mute</label>
  <button id="fullscreen" type="button">Fullscreen</button>
  <button id="return" type="button" disabled>Return</button><button id="close" type="button">Close</button>
</footer>
<script type="module" src="calibration.js"></script>
</body>
</html>
